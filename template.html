<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peninei Halakha Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a friend's careful study sheets, warm and clear, made for chavruta review.
   IDEA: the Shabbat table on Friday night, with a study binder of chapters beside it.
   PICTURE: a small stack-of-sefarim mark in a compact header.
   COLOUR and TYPE: kiddush-wine field, candle gold accent, white page; Frank Ruhl Libre + Heebo (Hebrew and Latin).
   LAYOUT: wine header, chapter rail, notes/quiz/search bar, one readable column. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#151011);--ink:light-dark(#1d1415,#f1e9e7);--soft:light-dark(#5e4f51,#bfb0ae);
--wine:#6a1d2c;--wine2:#4e1420;--gold:#e5ad3e;--panel:light-dark(#f7f0f1,#221a1b);--line:light-dark(#e6d8da,#3a2c2e);
--yes:light-dark(#1f6f4a,#7fd3a6);--yesbg:light-dark(#e3f3ea,#183126);--no:light-dark(#a3232f,#ff9aa2);--nobg:light-dark(#fbe6e7,#3a1a1d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Heebo,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Frank Ruhl Libre",Georgia,serif;line-height:1.1;text-wrap:balance}
a{color:inherit}
button{font-family:Heebo,sans-serif}
button:focus-visible,#q:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{background:var(--wine);color:#fbf1ee;padding:12px max(5vw,16px)}
.hero-in{max-width:1180px;margin:auto;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;flex:none}
.htext{flex:1}
.hero h1{font-size:clamp(20px,2.6vw,26px);margin:0;font-weight:700;line-height:1.15}
.kick{font-size:13px;opacity:.85;margin:2px 0 0}
.kick a{color:#f6d38a}
.lang{display:inline-flex;background:var(--wine2);border-radius:999px;padding:3px;gap:3px;flex:none}
.lang button{font-weight:600;font-size:14px;border:0;border-radius:999px;min-height:36px;min-width:44px;padding:0 12px;background:transparent;color:#fbf1ee;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold);color:#2a1206}
.rail{background:var(--wine2);padding:8px max(5vw,16px)}
.rail-in{max-width:1180px;margin:auto;display:flex;flex-wrap:wrap;gap:6px}
.chb{display:inline-flex;gap:6px;align-items:center;border:1px solid #ffffff2a;background:#ffffff0d;color:#fbf1ee;border-radius:999px;min-height:34px;padding:2px 12px;cursor:pointer;font-size:14px;line-height:1.2;white-space:nowrap}
.chb b{font:700 15px "Frank Ruhl Libre",serif;color:var(--gold)}
.chb.on{background:var(--gold);color:#2a1206;border-color:var(--gold)}.chb.on b{color:#2a1206}
.chb.mix{font-weight:600}
#chsel{display:none;width:100%;font:16px Heebo,sans-serif;min-height:42px;padding:0 10px;border-radius:10px;border:1px solid #ffffff40;background:#ffffff14;color:#fbf1ee}
#chsel option{color:#1d1415;background:#fff}
.bar{background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:auto;padding:10px max(5vw,16px);display:flex;gap:10px;align-items:center}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.mode button{border:0;background:transparent;color:var(--ink);min-height:44px;padding:0 16px;font-weight:600;font-size:15px;cursor:pointer}
.mode button[aria-pressed=true]{background:var(--wine);color:#fff}
#q{flex:0 0 min(240px,32%);font:16px Heebo,sans-serif;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
#jump{flex:1;font:16px Heebo,sans-serif;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}#jump:focus-visible{outline:3px solid var(--gold);outline-offset:2px}#jump[hidden]{display:none}
main{max-width:820px;margin:auto;padding:clamp(20px,4vw,44px) max(5vw,16px) 40px}
.chead{margin:0 0 6px;font-size:15px;color:var(--soft)}
.ctitle{font-size:clamp(30px,4.4vw,44px);margin:0 0 16px}
.note{font-size:15px;color:var(--soft);border-inline-start:3px solid var(--gold);padding:4px 14px;margin:0 0 24px}
.chap[hidden],section[hidden],.ctag[hidden]{display:none}
.ctag{font:700 22px "Frank Ruhl Libre",serif;color:var(--soft);margin:30px 0 0;padding-top:14px;border-top:3px solid var(--gold)}
section{scroll-margin-top:16px;padding-block:6px 18px;border-bottom:1px solid var(--line)}
h2{font-size:clamp(24px,3vw,31px);margin:26px 0 12px;color:light-dark(var(--wine),#f2c4cc)}
ul,ol{padding-inline-start:1.3em}
li{margin:5px 0}
li>ul{margin-top:4px}
blockquote{margin:18px 0;padding:14px 18px;background:var(--panel);border-radius:12px;font-family:"Frank Ruhl Libre",Georgia,serif;font-size:19px}
blockquote p{margin:0}
.tw{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.4}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-size:14px;color:var(--soft);font-weight:500}
td:first-child{min-width:140px}
.y,.n{display:inline-block;font-weight:700;border-radius:6px;padding:1px 8px;white-space:nowrap}
.y{color:var(--yes);background:var(--yesbg)}.n{color:var(--no);background:var(--nobg)}
mark{background:color-mix(in srgb,var(--gold) 45%,transparent);color:inherit;border-radius:3px}
.empty{color:var(--soft);padding:30px 0;text-align:center}
/* quiz: same game as the user's other quiz sites (aliyah-yomit, orach-chaim-x2) */
#quiz{--accent:var(--wine);--accent-soft:var(--panel);--card:var(--bg);--muted:var(--soft);--radius:10px}
.sefersetup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px}
.sefersetup .label{font-size:13px;font-weight:700;color:var(--ink);margin:14px 0 6px}
.sefershead{display:flex;align-items:center;gap:10px}
.linkish{border:0;background:none;padding:0;font:inherit;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;text-decoration:underline}
.sefersizes,.seferparashot{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer;min-height:34px}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.chip .chipcount{margin-inline-start:6px;font-size:11.5px;opacity:.7}
.sefernote{margin:14px 0 10px;font-size:14px;color:var(--muted)}
.button{border:0;background:var(--accent);color:#fff;border-radius:10px;min-height:44px;padding:0 20px;font:inherit;font-weight:700;font-size:15.5px;cursor:pointer}
.button:hover{filter:brightness(1.15)}
.button:disabled{opacity:.45;cursor:default;filter:none}
.button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);margin-inline-start:8px}
.quizintro{font-size:14px;color:var(--muted);margin:0 0 10px}
.quizintro p{margin:0 0 4px}
.quizbestline{color:var(--accent);font-weight:600;margin:14px 0 0}
.quizbar{position:sticky;top:6px;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px 0;margin:0 0 12px}
.quizstats{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.quizpts{font-size:18px;font-weight:800;color:var(--accent)}
.quizstreak{font-size:15px;font-weight:700;color:var(--muted);min-width:1em}
.quizstreak.hot{color:#d9622b;animation:quizglow 1.2s ease-in-out infinite alternate}
.quizcount{font-size:13px;color:var(--muted)}
.quizbar button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.quizbar button:hover{border-color:var(--accent);color:var(--accent)}
.quizprogress{flex-basis:100%;height:6px;margin:0 -12px;background:var(--line);border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.quizprogress .fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#e8c46a);transition:width .4s ease}
.quiztoast{position:absolute;top:calc(100% + 8px);inset-inline-start:50%;transform:translateX(50%);background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:6px 16px;border-radius:20px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:quiztoastin .3s ease-out;transition:opacity .5s}
[dir=ltr] .quiztoast{transform:translateX(-50%)}
.quiztoast.out{opacity:0}
.quizlist{list-style:none;counter-reset:q;margin:0;padding:0}
.quizq{counter-increment:q;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:var(--radius);padding:12px 14px;margin:0 0 10px;transition:border-color .3s;scroll-margin-top:70px}
.quizq.got{border-inline-start-color:#2e7d4f}
.quizq.missed{border-inline-start-color:#b3443a}
.quizq.pop{animation:quizpop .45s ease-out}
.quizq.shake{animation:quizshake .45s ease-in-out}
.quiztags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.quiztag{display:inline-block;padding:1px 9px;border-radius:10px;background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--accent);font-size:12px;font-weight:600}
.quizprompt{margin:0 0 10px;font-weight:600;font-size:16.5px}
.quizprompt::before{content:counter(q) ". ";color:var(--gold)}
.quizopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.quizopt{position:relative;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--radius);padding:8px 12px;font:inherit;font-size:15px;text-align:start;cursor:pointer;min-height:44px;transition:transform .1s,border-color .15s,background .15s}
.quizopt:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.quizopt:not(:disabled):active{transform:scale(.98)}
.quizopt:disabled{cursor:default;opacity:.6}
.quizopt.right{opacity:1;border-color:#2e7d4f;background:#e6f4ea;color:#1d5434;font-weight:600}
.quizopt.right::after{content:" ✓"}
.quizopt.wrong{opacity:1;border-color:#b3443a;background:#fbe9e7;color:#8a2e26}
.quizopt.wrong::after{content:" ✗"}
.quizfloat{position:absolute;top:-4px;inset-inline-end:10px;pointer-events:none;font-weight:800;font-size:18px;color:#2e7d4f;animation:quizfloat 1.2s ease-out forwards}
.quizverdict{margin:10px 0 4px;font-size:15px}
.quizverdict.ok b{color:#2e7d4f}
.quizverdict.no b{color:#b3443a}
.quizresults{text-align:center;margin:18px 0 8px;padding:22px 16px 20px;background:linear-gradient(color-mix(in srgb,var(--gold) 18%,var(--card)),var(--card) 140px);border:2px solid var(--gold);border-radius:14px;animation:quizpop .5s ease-out}
.quizresults h3{margin:4px 0 6px;font-size:24px;color:var(--accent)}
.quizfinal{margin:0 0 4px;font-size:18px;font-weight:700}
.quizfacts{margin:0 0 8px;color:var(--muted);font-size:14px}
.quizrecord{display:inline-block;margin:2px 0 10px;padding:4px 14px;border-radius:20px;background:var(--gold);color:#fff;font-weight:700;animation:quizglow 1s ease-in-out 3 alternate}
.quizmissed{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 14px;font-size:14px}
.quizmissed button{min-width:32px;border:1px solid #b3443a;background:#fbe9e7;color:#8a2e26;border-radius:16px;padding:2px 8px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:13px;border-radius:2px;opacity:.95;animation-name:quizfall;animation-timing-function:cubic-bezier(.25,.6,.5,1);animation-fill-mode:forwards}
@keyframes quizpop{0%{transform:scale(.97)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes quizshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes quizfloat{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
@keyframes quizglow{from{filter:brightness(1)}to{filter:brightness(1.25);text-shadow:0 0 8px rgba(217,98,43,.35)}}
@keyframes quiztoastin{from{opacity:0;margin-top:-8px}to{opacity:1;margin-top:0}}
@keyframes quizfall{to{transform:translate(var(--drift,0),105vh) rotate(var(--spin,720deg));opacity:.9}}
@media(prefers-reduced-motion:reduce){.quizq.pop,.quizq.shake,.quizresults,.quizstreak.hot,.quizrecord,.quiztoast{animation:none}.quizprogress .fill{transition:none}}
footer{background:var(--wine2);color:#f3dfdc;padding:28px max(5vw,16px);font-size:15px}
footer div{max-width:820px;margin:auto}
footer a{color:var(--gold)}
[dir=rtl] body{font-size:18px}
@media(max-width:600px){
 .rail-in{display:none}#chsel{display:block}
 .bar-in{flex-wrap:wrap}#q{flex:1 1 0}#jump{flex:1 1 100%}
 table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}
 .stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 0}
 .stack td::before{content:attr(data-l);color:var(--soft);font-size:13px;flex:0 0 42%}.stack td .v{flex:1}
 .stack td:first-child{font-size:16px}.stack td:first-child::before{content:none}}
/* home page + side toolbar */
.logo-btn{border:0;background:none;padding:0;cursor:pointer;display:flex;flex:none;border-radius:8px}
.logo-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero h1{cursor:pointer}
.homeview{padding:clamp(24px,5vw,56px) max(5vw,16px) clamp(32px,6vw,72px)}
.home-in{max-width:980px;margin:auto}
.hlede{font-size:18px;color:var(--soft);margin:0 0 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:start;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--wine);border-radius:16px;padding:24px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px #00000022}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.cicon{width:58px;height:58px;border-radius:14px;background:var(--wine);display:grid;place-items:center}
.cicon svg{width:36px;height:36px}
.cname{font:700 clamp(28px,4vw,36px)/1.1 "Frank Ruhl Libre",serif;color:light-dark(var(--wine),#f2c4cc)}
.cheb{font:500 22px "Frank Ruhl Libre",serif;color:var(--soft);margin-inline-start:10px}
.cmeta{font-size:14px;font-weight:600;color:var(--soft)}
.cdesc{font-size:16px;line-height:1.55}
.cgo{margin-top:4px;font-weight:700;color:light-dark(var(--wine),#f2c4cc)}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1260px;margin:auto}
.layout[hidden],.homeview[hidden]{display:none}
.side{border-inline-end:1px solid var(--line);background:var(--panel)}
.side-in{position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:16px 12px 28px}
.back{border:0;background:none;color:light-dark(var(--wine),#f2c4cc);font:600 14px Heebo,sans-serif;padding:6px 8px;cursor:pointer;border-radius:8px;min-height:36px}
.back:hover{background:color-mix(in srgb,var(--wine) 8%,transparent)}
.back:focus-visible,#rail button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.sbook{font:700 26px/1.1 "Frank Ruhl Libre",serif;margin:6px 8px 12px;color:var(--ink)}
#rail .chb{display:flex;width:100%;align-items:baseline;gap:10px;background:none;border:0;border-radius:8px;color:var(--ink);padding:7px 10px;min-height:38px;white-space:normal;text-align:start;font-size:15px;line-height:1.3;cursor:pointer}
#rail .chb b{color:light-dark(var(--wine),var(--gold));min-width:1.7em;flex:none}
#rail .chb:hover{background:color-mix(in srgb,var(--wine) 9%,transparent)}
#rail .chb.on{background:var(--wine);color:#fff}
#rail .chb.on b{color:var(--gold)}
#rail .chb.mix{margin-top:12px;border:1px solid var(--line);font-weight:600}
#rail .chb.mix.on{border-color:var(--wine)}
.secs{list-style:none;margin:4px 0 10px;margin-inline-start:22px;padding:0;padding-inline-start:8px;border-inline-start:2px solid var(--gold)}
.secs li{margin:0}
.sec{display:block;width:100%;border:0;background:none;color:var(--soft);font:14px/1.3 Heebo,sans-serif;text-align:start;padding:5px 8px;border-radius:6px;cursor:pointer}
.sec:hover,.sec.on{color:var(--ink);background:color-mix(in srgb,var(--gold) 22%,transparent)}
.content{min-width:0}
.side #chsel{display:none}
@media(min-width:901px){#jump{display:none!important}}
@media(max-width:900px){
 .layout{display:block}
 .side{border-inline-end:0;border-bottom:1px solid var(--line)}
 .side-in{position:static;max-height:none;overflow:visible;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
 .sbook{margin:0;font-size:22px}
 #rail{display:none}
 .side #chsel{display:block;flex:1 1 100%;color:var(--ink);background:var(--bg);border-color:var(--line)}
}
</style>
</head>
<body>
<header class="hero">
 <div class="hero-in">
  <button class="logo-btn" id="home-btn" aria-label="Home"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
   <rect x="6" y="30" width="36" height="9" rx="2" fill="#e5ad3e"/><rect x="6" y="30" width="5" height="9" fill="#b07f1f"/>
   <rect x="9" y="20" width="32" height="9" rx="2" fill="#fbf1ee"/><rect x="9" y="20" width="5" height="9" fill="#d9c9c4"/>
   <rect x="7" y="10" width="30" height="9" rx="2" fill="#c98a3a"/><rect x="7" y="10" width="5" height="9" fill="#9b6526"/>
   <rect x="16" y="13.5" width="16" height="2" rx="1" fill="#fbf1ee" opacity=".7"/><rect x="18" y="23.5" width="16" height="2" rx="1" fill="#6a1d2c" opacity=".35"/><rect x="15" y="33.5" width="20" height="2" rx="1" fill="#6a1d2c" opacity=".35"/>
  </svg></button>
  <div class="htext">
   <h1 data-t="title"></h1>
   <p class="kick" data-t="kick"></p>
  </div>
  <div class="lang" role="group" aria-label="Language">
   <button id="b-en" aria-pressed="true">EN</button>
   <button id="b-he" aria-pressed="false" lang="he">עב</button>
  </div>
 </div>
</header>
<section id="homeview" class="homeview" hidden><div class="home-in"><p class="hlede" id="hlede"></p><div class="cards" id="cards"></div></div></section>
<div class="layout" id="bookview" hidden>
<aside class="side" aria-label="Chapters"><div class="side-in"><button class="back" id="back"></button><p class="sbook" id="sbook"></p><select id="chsel" aria-label="Chapter"></select><nav id="rail"></nav></div></aside>
<div class="content">
<nav class="bar" aria-label="View">
 <div class="bar-in">
  <div class="mode" role="group">
   <button id="m-notes" aria-pressed="true"></button>
   <button id="m-quiz" aria-pressed="false"></button>
  </div>
  <input id="q" type="search" autocomplete="off">
  <select id="jump"></select>
 </div>
</nav>
<main>
 <div id="notes">
  <p class="chead" id="chead"></p>
  <h2 class="ctitle" id="ctitle"></h2>
  <p class="note" data-t="note"></p>
  {{CHAPTERS}}
  <p class="empty" id="empty" hidden></p>
 </div>
 <div id="quiz" hidden>
  <p class="chead" id="qhead"></p>
  <h2 class="ctitle" id="qtitle"></h2>
  <div id="game" aria-live="polite"></div>
 </div>
</main>
</div>
</div>
<footer><div data-t="foot"></div></footer>
<script>
{
const CH={{DATA}};
const CHK={{DATAK}};
const CHZ={{DATAZ}};
const BK={s:CH,k:CHK,z:CHZ};
const BPRE=b=>b==='s'?'':b;
const numsOf=b=>Object.keys(BK[b]).map(Number).sort((x,y)=>x-y);

function hl(el,term){
 const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];
 while(w.nextNode())nodes.push(w.currentNode);
 nodes.forEach(n=>{const i=n.nodeValue.toLowerCase().indexOf(term);if(i<0)return;
  const m=document.createElement('mark'),r=n.splitText(i);r.splitText(term.length);m.textContent=r.nodeValue;r.replaceWith(m);});
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function qbest(k){try{return JSON.parse(localStorage.getItem('quiz-best:phs:'+k))||null}catch(e){return null}}

function gkey(){return BPRE(book)+(mixSet?'all':String(ch))}
function setupOf(k){if(!SETUP.has(k))SETUP.set(k,{count:mixSet?20:QALL,chs:new Set(NUMS),mix:true});return SETUP.get(k)}
function poolOf(st){return mixSet?NUMS.filter(n=>st.chs.has(n)).reduce((a,n)=>a+CHX[n].quiz.length,0):CHX[ch].quiz.length}
function draw(st){
 const banks=(mixSet?NUMS.filter(n=>st.chs.has(n)):[ch]).map(n=>({c:n,qs:CHX[n].quiz.map((_,i)=>i)}));
 const want=banks.map(()=>0);let left=Math.min(st.count,banks.reduce((a,b)=>a+b.qs.length,0));
 const ord=shuffle(banks.map((_,i)=>i));
 while(left>0)for(const i of ord){if(left>0&&want[i]<banks[i].qs.length){want[i]++;left--;}}
 let out=[];banks.forEach((b,i)=>shuffle(b.qs.slice()).slice(0,want[i]).sort((x,y)=>x-y).forEach(k=>out.push({c:b.c,i:k})));
 if(st.mix)out=shuffle(out);
 return out.map(x=>{const Q=CHX[x.c].quiz[x.i],o=shuffle(Q.o.map((_,j)=>j));return {...x,ord:o,a:o.indexOf(Q.a)}});
}
function bestKey(k,n,st){let b=k+':'+n;if(mixSet&&st.chs.size<NUMS.length)b+=':'+[...st.chs].sort().join('+');return b}
function startRun(){const k=gkey(),st=setupOf(k),qs=draw(st);RUNS.set(k,{qs,chosen:new Map(),bk:bestKey(k,qs.length,st)});}
function tally(run){let points=0,right=0,streak=0,longest=0;const missed=[];
 run.qs.forEach((q,i)=>{if(!run.chosen.has(i))return;
  if(run.chosen.get(i)===q.a){right++;streak++;longest=Math.max(longest,streak);points+=QP;if(streak>=QSF)points+=QSB;}
  else{streak=0;missed.push(i);}});
 return {points,right,streak,longest,missed,done:run.chosen.size};}
function confetti(){if(calm())return;const l=document.createElement('div');l.className='confetti';l.setAttribute('aria-hidden','true');
 const cs=['#e5ad3e','#6a1d2c','#2e7d4f','#d0675c','#6f93cf','#e8c46a'];
 for(let n=0;n<90;n++){const b=document.createElement('i');b.style.left=Math.random()*100+'%';b.style.background=cs[n%cs.length];
  b.style.animationDelay=Math.random()*.6+'s';b.style.animationDuration=(2.2+Math.random()*1.6)+'s';
  b.style.setProperty('--drift',(Math.random()-.5)*220+'px');b.style.setProperty('--spin',(Math.random()-.5)*1440+'deg');l.appendChild(b);}
 document.body.appendChild(l);setTimeout(()=>l.remove(),4600);}
function floatUp(anchor,text){if(calm())return;const t=document.createElement('span');t.className='quizfloat';t.textContent=text;t.dir='ltr';anchor.appendChild(t);setTimeout(()=>t.remove(),1300);}
function toast(host,text){const o=host.querySelector('.quiztoast');if(o)o.remove();const t=document.createElement('div');t.className='quiztoast';t.textContent=text;t.setAttribute('role','status');host.appendChild(t);

function gameView(){

  return;}

 box.innerHTML=`<div class="quizintro"><p>${L.rules(QP,QSF,QSB)}</p>${prior?`<p class="quizbestline">${L.best}: ${L.bestShort(prior.right,prior.total)} · ${L.pts(prior.points)}</p>`:''}</div>
  <div class="quizbar" id="qbar"><div class="quizstats"><span class="quizpts" id="qpts"></span><span class="quizstreak" id="qstr"></span><span class="quizcount" id="qcnt"></span></div><button data-a="change">${L.change}</button><div class="quizprogress"><div class="fill" id="qfill"></div></div></div>
  <ol class="quizlist">${run.qs.map((q,i)=>{const Q=CHX[q.c].quiz[q.i];return `<li class="quizq" id="qi-${i}">${mixSet?`<div class="quiztags"><span class="quiztag">${L.ch(q.c)} · ${CHX[q.c].t[lang]}</span></div>`:''}<p class="quizprompt">${Q.q[lang]}</p><div class="quizopts">${q.ord.map((j,x)=>`<button class="quizopt" data-k="${i}" data-x="${x}">${Q.o[j][lang]}</button>`).join('')}</div><div class="quizafter"></div></li>`}).join('')}</ol>
  <div class="quizresults" id="qres" hidden></div>`;
 run.qs.forEach((q,i)=>{if(run.chosen.has(i))show(run,i,false)});
 const t=update(run);if(t.done===total)finish(run,false);
}
function show(run,i,fresh){const L=T[lang],q=run.qs[i],Q=CHX[q.c].quiz[q.i],li=$('qi-'+i),pick=run.chosen.get(i),good=pick===q.a;
 li.querySelectorAll('.quizopt').forEach((b,x)=>{b.disabled=true;b.classList.toggle('right',x===q.a);b.classList.toggle('wrong',x===pick&&!good);});
 li.classList.add(good?'got':'missed');
 if(fresh&&!calm()){li.classList.add(good?'pop':'shake');setTimeout(()=>li.classList.remove('pop','shake'),600);}
 li.querySelector('.quizafter').innerHTML=`<p class="quizverdict ${good?'ok':'no'}"><b>${good?L.right[i%L.right.length]:L.wrong[i%L.wrong.length]}</b> ${Q.w[lang]}</p>`;}
function update(run){const L=T[lang],t=tally(run),total=run.qs.length;
 $('qpts').textContent=L.pts(t.points);$('qstr').textContent=t.streak>=2?`🔥 ${t.streak}`:'';$('qstr').classList.toggle('hot',t.streak>=QSF);
 $('qcnt').textContent=L.count(t.right,t.done,total);$('qfill').style.width=(t.done/total*100)+'%';return t;}
function finish(run,fresh){const L=T[lang],t=tally(run),total=run.qs.length,prior=qbest(run.bk),record=!prior||t.points>prior.points;
 if(fresh&&record)qsave(run.bk,{right:t.right,total,points:t.points});
 const r=$('qres');r.hidden=false;
 r.innerHTML=`<h3>${L.rank(t.right,total,!!mixSet)}</h3><p class="quizfinal">${L.bestShort(t.right,total)} · ${L.pts(t.points)}</p><p class="quizfacts">${L.longest(t.longest)}</p>
  ${fresh&&record&&prior?`<p class="quizrecord">${L.newBest}</p>`:prior&&!record?`<p class="quizfacts">${L.best}: ${L.pts(prior.points)}</p>`:''}
  ${t.missed.length?`<div class="quizmissed"><span>${L.review}</span>${t.missed.map(i=>`<button data-a="goto" data-k="${i}">${i+1}</button>`).join('')}</div>`:''}
  <button class="button" data-a="again">${L.again}</button><button class="button ghost" data-a="change">${L.change}</button>`;
 if(fresh){if(t.right/total>=.7)confetti();setTimeout(()=>r.scrollIntoView({behavior:calm()?'auto':'smooth',block:'center'}),350);}}
function pickOpt(btn){const k=gkey(),run=RUNS.get(k),i=+btn.dataset.k,x=+btn.dataset.x;if(!run||run.chosen.has(i))return;

  if(t.streak===run.qs.length||[3,5,10,15,20,25,50].includes(t.streak))toast($('qbar'),T[lang].toast(t.streak,run.qs.length));}
 if(t.done===run.qs.length)finish(run,true);}
function render(){
 const home=view==='home';$('homeview').hidden=!home;$('bookview').hidden=home;
 if(!home){renderBook();return;}
 document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=BT.home[lang][e.dataset.t]??T[lang][e.dataset.t]);
 $('b-en').setAttribute('aria-pressed',lang==='en');$('b-he').setAttribute('aria-pressed',lang==='he');
 document.title=BT.home[lang].doc;homeCards();}
function renderBook(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=BT[book][lang][e.dataset.t]??T[lang][e.dataset.t]);
 $('back').textContent=BT.home[lang].back;$('sbook').textContent=BT[book][lang].bk;
 $('b-en').setAttribute('aria-pressed',lang==='en');$('b-he').setAttribute('aria-pressed',lang==='he');
 $('m-notes').textContent=T[lang].notes;$('m-quiz').textContent=T[lang].quiz;
 $('m-notes').setAttribute('aria-pressed',mode==='notes');$('m-quiz').setAttribute('aria-pressed',mode==='quiz');
 q.placeholder=T[lang].q;q.setAttribute('aria-label',T[lang].q);q.hidden=mode!=='notes';
 document.title=BT[book][lang].doc;
 rail();buildChips();
 $('notes').hidden=mode!=='notes';$('quiz').hidden=mode!=='quiz';
 if(mode==='notes')renderNotes();else gameView();
 spySoon();
}
// scroll-spy: highlight the section being read in the side toolbar (and the phone "jump" menu)
let spyRaf=0,spyHold=0;
function spySoon(){if(!spyRaf)spyRaf=requestAnimationFrame(spy);}
function spy(){spyRaf=0;
 if(view!=='book'||mode!=='notes'||q.value.trim()||Date.now()<spyHold)return;
 const ss=[...document.querySelectorAll('.chap:not([hidden]) section:not([hidden])')];if(!ss.length)return;
 const line=innerHeight*.3;let at=ss[0];
 for(const s of ss){if(s.getBoundingClientRect().top<=line)at=s;else break;}
 if(innerHeight+scrollY>=document.documentElement.scrollHeight-4&&scrollY>0)at=ss[ss.length-1];
 const id=at.id,box=document.querySelector('.side-in');
 $('rail').querySelectorAll('.sec').forEach(b=>{const on=b.dataset.s===id;b.classList.toggle('on',on);
  if(on){b.setAttribute('aria-current','location');const r=b.getBoundingClientRect(),br=box.getBoundingClientRect();
   if(box.scrollHeight>box.clientHeight&&(r.top<br.top+40||r.bottom>br.bottom-20))box.scrollTop+=r.top-br.top-br.height/3;}
  else b.removeAttribute('aria-current');});
 if(!jump.hidden&&jump.value!==id&&[...jump.options].some(o=>o.value===id))jump.value=id;
}
addEventListener('scroll',spySoon,{passive:true});
addEventListener('resize',spySoon);
const holdSpy=()=>{spyHold=Date.now()+900;setTimeout(spySoon,950);};
function hash(){try{if(view==='home'){history.replaceState(null,'','#'+lang);return;}history.replaceState(null,'','#'+lang+'-'+BPRE(book)+(mixSet?'mix':ch)+(mode==='quiz'&&!mixSet?'-quiz':''))}catch(e){}}
function goCh(c){
 if(c==='mix'){const all=[];NUMS.forEach(n=>CHX[n].quiz.forEach((x,i)=>all.push({c:n,i})));mixSet=true;mode='quiz';}
 else{mixSet=null;ch=+c;cur='all';q.value='';secOpen=true;}
 view='book';render();hash();window.scrollTo(0,0);}
$('rail').addEventListener('click',e=>{const s=e.target.closest('.sec');if(s){cur='all';q.value='';renderNotes();holdSpy();const t=$(s.dataset.s);if(t)t.scrollIntoView({behavior:calm()?'auto':'smooth',block:'start'});$('rail').querySelectorAll('.sec').forEach(x=>x.classList.toggle('on',x===s));return;}const b=e.target.closest('.chb');if(!b)return;if(b.dataset.c!=='mix'&&+b.dataset.c===ch&&!mixSet&&mode==='notes'&&view==='book'){secOpen=!secOpen;rail();spySoon();$('rail').querySelector('.chb.on')?.focus();return;}goCh(b.dataset.c);});
$('chsel').addEventListener('change',e=>goCh(e.target.value));
jump.addEventListener('change',()=>{cur='all';renderNotes();holdSpy();const id=jump.value;
 if(id!=='all')$(id).scrollIntoView({behavior:'smooth',block:'start'});});
q.addEventListener('input',()=>{cur='all';buildChips();renderNotes();});
$('m-notes').addEventListener('click',()=>{mode='notes';mixSet=null;render();hash();});
$('m-quiz').addEventListener('click',()=>{mode='quiz';q.value='';render();hash();});
$('game').addEventListener('click',e=>{const o=e.target.closest('.quizopt');if(o){if(!o.disabled)pickOpt(o);return}
 const a=e.target.closest('[data-a]');if(!a)return;const v=a.dataset.a,k=gkey(),st=setupOf(k);
 if(v==='size')st.count=+a.dataset.n;
 else if(v==='ch'){const c=+a.dataset.c;st.chs.has(c)?st.chs.delete(c):st.chs.add(c);}
 else if(v==='chall')st.chs=new Set(NUMS);
 else if(v==='chnone')st.chs=new Set();
 else if(v==='mix')st.mix=a.dataset.m==='1';
 else if(v==='start'||v==='again'){if(!poolOf(st))return;startRun();gameView();$('quiz').scrollIntoView({block:'start'});return;}
 else if(v==='change'){RUNS.delete(k);gameView();$('quiz').scrollIntoView({block:'start'});return;}
 else if(v==='goto'){$('qi-'+a.dataset.k).scrollIntoView({behavior:calm()?'auto':'smooth',block:'center'});return;}
 gameView();});

function homeCards(){const L=lang;$('hlede').textContent=BT.home[L].lede;
 $('cards').innerHTML=['s','k','ch','pu'].map(id=>{const C=CARD[id],b=C.b||id,n=C.chs||numsOf(b),qs=n.reduce((a,c)=>a+BK[b][c].quiz.length,0),
  r=L==='he'?HEB[n[0]]+'–'+HEB[n[n.length-1]]:n[0]+'–'+n[n.length-1],name=C.name?C.name[L]:BT[b][L].bk;
  return `<button class="card" data-b="${b}" data-c="${n[0]}"><span class="cicon">${C.icon}</span><span class="cname">${name}${L==='en'?`<span class="cheb" lang="he">${C.heb}</span>`:''}</span><span class="cmeta">${BT.home[L].chs(r,n.length,qs)}</span><span class="cdesc">${C[L]}</span><span class="cgo">${BT.home[L].open}</span></button>`;}).join('');}
function goHome(){view='home';mixSet=null;q.value='';render();hash();window.scrollTo(0,0);}
$('cards').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;setBook(c.dataset.b);ch=+c.dataset.c||NUMS[0];mixSet=null;mode='notes';cur='all';q.value='';view='book';render();hash();window.scrollTo(0,0);});
$('back').addEventListener('click',goHome);$('home-btn').addEventListener('click',goHome);
document.querySelector('.hero h1').addEventListener('click',goHome);
$('b-en').addEventListener('click',()=>{lang='en';render();hash();});
$('b-he').addEventListener('click',()=>{lang='he';render();hash();});
function route(){const h=location.hash||'',m=h.match(/^#(en|he)-([kz]?)(\d+|mix)(-quiz)?$/);
 if(m){view='book';lang=m[1];setBook(m[2]||'s');if(m[3]==='mix'){mixSet=true;mode='quiz';}
  else if(CHX[m[3]]){ch=+m[3];mixSet=null;mode=m[4]?'quiz':'notes';}else{ch=NUMS[0];}}
 else{view='home';const l=h.match(/^#(en|he)$/);if(l)lang=l[1];}
 render();}
addEventListener('hashchange',route);route();
