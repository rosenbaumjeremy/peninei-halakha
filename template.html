<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hilchot Shabbat Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a friend's careful study sheets, warm and clear, made for chavruta review.
   IDEA: the Shabbat table on Friday night, with a study binder of chapters beside it.
   PICTURE: lit candlesticks beside covered challot on a wine-red cloth.
   COLOUR and TYPE: kiddush-wine field, candle gold accent, white page; Frank Ruhl Libre + Heebo (Hebrew and Latin).
   LAYOUT: wine header, chapter rail, notes/quiz/search bar, one readable column. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#151011);--ink:light-dark(#1d1415,#f1e9e7);--soft:light-dark(#5e4f51,#bfb0ae);
--wine:#6a1d2c;--wine2:#4e1420;--gold:#e5ad3e;--panel:light-dark(#f7f0f1,#221a1b);--line:light-dark(#e6d8da,#3a2c2e);
--yes:light-dark(#1f6f4a,#7fd3a6);--yesbg:light-dark(#e3f3ea,#183126);--no:light-dark(#a3232f,#ff9aa2);--nobg:light-dark(#fbe6e7,#3a1a1d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Heebo,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Frank Ruhl Libre",Georgia,serif;line-height:1.1;text-wrap:balance}
a{color:inherit}
button{font-family:Heebo,sans-serif}
button:focus-visible,#q:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{background:var(--wine);color:#fbf1ee;padding:clamp(26px,4.5vw,56px) max(5vw,16px) clamp(20px,3vw,36px)}
.hero-in{max-width:1180px;margin:auto;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center}
.kick{font-size:15px;opacity:.85;margin:0 0 10px}
.hero h1{font-size:clamp(34px,5vw,52px);margin:0 0 14px;font-weight:700}
.lede{font-size:17px;max-width:58ch;margin:0 0 22px;opacity:.92}
.lang{display:inline-flex;background:var(--wine2);border-radius:999px;padding:4px;gap:4px}
.lang button{font-weight:600;font-size:16px;border:0;border-radius:999px;min-height:44px;padding:0 20px;background:transparent;color:#fbf1ee;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold);color:#2a1206}
.art{width:100%;aspect-ratio:5/4;max-height:340px}
.art svg{width:100%;height:100%;display:block;border-radius:0 0 16px 16px}
@keyframes flick{0%,100%{transform:scale(1,1)}40%{transform:scale(.94,1.06)}70%{transform:scale(1.04,.97)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 2.4s ease-in-out infinite}
.flame.b{animation-delay:-1.1s}
@media(prefers-reduced-motion:reduce){.flame{animation:none}}
.rail{background:var(--wine2);padding:0 max(5vw,16px) 14px}
.rail-in{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chb{display:flex;gap:10px;align-items:center;text-align:start;border:1px solid #ffffff2a;background:#ffffff0d;color:#fbf1ee;border-radius:12px;min-height:48px;padding:8px 12px;cursor:pointer;font-size:15px;line-height:1.25}
.chb b{font:700 20px "Frank Ruhl Libre",serif;color:var(--gold);flex:none;min-width:1.6em}
.chb.on{background:var(--gold);color:#2a1206;border-color:var(--gold)}.chb.on b{color:#2a1206}
.chb.mix{justify-content:center;font-weight:600}
.bar{background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:auto;padding:10px max(5vw,16px);display:flex;gap:10px;align-items:center}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.mode button{border:0;background:transparent;color:var(--ink);min-height:44px;padding:0 16px;font-weight:600;font-size:15px;cursor:pointer}
.mode button[aria-pressed=true]{background:var(--wine);color:#fff}
#q{flex:0 0 min(240px,32%);font:16px Heebo,sans-serif;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
#jump{flex:1;font:16px Heebo,sans-serif;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}#jump:focus-visible{outline:3px solid var(--gold);outline-offset:2px}#jump[hidden]{display:none}
main{max-width:820px;margin:auto;padding:clamp(20px,4vw,44px) max(5vw,16px) 40px}
.chead{margin:0 0 6px;font-size:15px;color:var(--soft)}
.ctitle{font-size:clamp(30px,4.4vw,44px);margin:0 0 16px}
.note{font-size:15px;color:var(--soft);border-inline-start:3px solid var(--gold);padding:4px 14px;margin:0 0 24px}
.chap[hidden],section[hidden],.ctag[hidden]{display:none}
.ctag{font:700 22px "Frank Ruhl Libre",serif;color:var(--soft);margin:30px 0 0;padding-top:14px;border-top:3px solid var(--gold)}
section{scroll-margin-top:16px;padding-block:6px 18px;border-bottom:1px solid var(--line)}
h2{font-size:clamp(24px,3vw,31px);margin:26px 0 12px;color:light-dark(var(--wine),#f2c4cc)}
ul,ol{padding-inline-start:1.3em}
li{margin:5px 0}
li>ul{margin-top:4px}
blockquote{margin:18px 0;padding:14px 18px;background:var(--panel);border-radius:12px;font-family:"Frank Ruhl Libre",Georgia,serif;font-size:19px}
blockquote p{margin:0}
.tw{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.4}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-size:14px;color:var(--soft);font-weight:500}
td:first-child{min-width:140px}
.y,.n{display:inline-block;font-weight:700;border-radius:6px;padding:1px 8px;white-space:nowrap}
.y{color:var(--yes);background:var(--yesbg)}.n{color:var(--no);background:var(--nobg)}
mark{background:color-mix(in srgb,var(--gold) 45%,transparent);color:inherit;border-radius:3px}
.empty{color:var(--soft);padding:30px 0;text-align:center}
/* quiz */
.qtop{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:0 0 18px}
.score{font:700 clamp(28px,4vw,40px) "Frank Ruhl Libre",serif;color:var(--wine)}
.score small{font:500 15px Heebo,sans-serif;color:var(--soft);margin-inline-start:8px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;min-height:44px;padding:0 16px;font-weight:600;font-size:15px;cursor:pointer}
.meter{height:8px;background:var(--panel);border-radius:99px;overflow:hidden;margin:0 0 22px}
.meter i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.qcard{border:1px solid var(--line);border-radius:14px;padding:18px clamp(14px,3vw,22px);margin:0 0 16px}
.qnum{font-size:14px;color:var(--soft);margin:0 0 4px}
.qq{font:600 19px/1.4 Heebo,sans-serif;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:start;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;min-height:46px;padding:10px 14px;font-size:16px;line-height:1.35;cursor:pointer}
.opt:hover:not(:disabled){background:var(--panel)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--yes);background:var(--yesbg);color:var(--yes);font-weight:600}
.opt.wrong{border-color:var(--no);background:var(--nobg);color:var(--no)}
.why{margin:12px 0 0;font-size:15.5px;padding:10px 14px;background:var(--panel);border-radius:10px}
.why b{color:var(--wine)}
footer{background:var(--wine2);color:#f3dfdc;padding:28px max(5vw,16px);font-size:15px}
footer div{max-width:820px;margin:auto}
footer a{color:var(--gold)}
[dir=rtl] body{font-size:18px}
@media(max-width:760px){.hero-in{grid-template-columns:minmax(0,1fr)}.art{max-height:200px;order:2}}
@media(max-width:600px){
 .rail-in{grid-template-columns:repeat(2,minmax(0,1fr))}
 .bar-in{flex-wrap:wrap}#q{flex:1 1 0}#jump{flex:1 1 100%}
 table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}
 .stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 0}
 .stack td::before{content:attr(data-l);color:var(--soft);font-size:13px;flex:0 0 42%}.stack td .v{flex:1}
 .stack td:first-child{font-size:16px}.stack td:first-child::before{content:none}}
</style>
</head>
<body>
<header class="hero">
 <div class="hero-in">
  <div>
   <p class="kick" data-t="kick"></p>
   <h1 data-t="title"></h1>
   <p class="lede" data-t="lede"></p>
   <div class="lang" role="group" aria-label="Language">
    <button id="b-en" aria-pressed="true">English</button>
    <button id="b-he" aria-pressed="false" lang="he">עברית</button>
   </div>
  </div>
  <div class="art" aria-hidden="true">
   <svg viewBox="0 0 500 400" preserveAspectRatio="xMidYMid meet">
    <defs>
     <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
     <linearGradient id="silver" x1="0" x2="1"><stop offset="0" stop-color="#9aa0a8"/><stop offset=".45" stop-color="#f4f5f7"/><stop offset="1" stop-color="#7d838c"/></linearGradient>
     <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf4ee"/><stop offset="1" stop-color="#e2d3c8"/></linearGradient>
     <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f4a8a"/><stop offset="1" stop-color="#1d2f5e"/></linearGradient>
     <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff8a1f"/><stop offset=".6" stop-color="#ffd25a"/><stop offset="1" stop-color="#fff6d6"/></linearGradient>
     <g id="stick">
      <ellipse cx="0" cy="0" rx="34" ry="9" fill="#00000033"/>
      <path d="M-30 -4 Q0 -22 30 -4 L22 -14 Q0 -26 -22 -14Z" fill="url(#silver)"/>
      <rect x="-7" y="-120" width="14" height="108" rx="5" fill="url(#silver)"/>
      <ellipse cx="0" cy="-70" rx="13" ry="6" fill="url(#silver)"/>
      <path d="M-22 -128 L22 -128 L16 -118 L-16 -118Z" fill="url(#silver)"/>
      <rect x="-8" y="-196" width="16" height="70" rx="2" fill="#fbf7f0"/>
      <rect x="2" y="-196" width="6" height="70" fill="#00000010"/>
      <rect x="-1" y="-204" width="2" height="9" fill="#2b2523"/>
     </g>
    </defs>
    <path d="M0 300 Q250 268 500 300 L500 400 L0 400Z" fill="url(#cloth)"/>
    <path d="M0 300 Q250 268 500 300" fill="none" stroke="#c9b6a8" stroke-width="2"/>
    <circle cx="150" cy="96" r="60" fill="url(#glow)"/><circle cx="240" cy="96" r="60" fill="url(#glow)"/>
    <use href="#stick" x="150" y="300"/><use href="#stick" x="240" y="300"/>
    <path class="flame" d="M150 70 C140 84 141 96 150 100 C159 96 160 84 150 70Z" fill="url(#flame)"/>
    <path class="flame b" d="M240 70 C230 84 231 96 240 100 C249 96 250 84 240 70Z" fill="url(#flame)"/>
    <ellipse cx="385" cy="318" rx="98" ry="14" fill="#00000026"/>
    <path d="M290 312 Q295 236 385 228 Q475 236 480 312 Q385 330 290 312Z" fill="url(#cover)"/>
    <path d="M296 300 Q385 316 474 300" stroke="#e5ad3e" stroke-width="4" fill="none"/>
    <path d="M298 290 Q385 305 472 290" stroke="#e5ad3e" stroke-width="1.5" fill="none" opacity=".8"/>
    <path d="M325 254 Q385 236 445 254" stroke="#ffffff40" stroke-width="6" fill="none" stroke-linecap="round"/>
   </svg>
  </div>
 </div>
</header>
<nav class="rail" aria-label="Chapters"><div class="rail-in" id="rail"></div></nav>
<nav class="bar" aria-label="View">
 <div class="bar-in">
  <div class="mode" role="group">
   <button id="m-notes" aria-pressed="true"></button>
   <button id="m-quiz" aria-pressed="false"></button>
  </div>
  <input id="q" type="search" autocomplete="off">
  <select id="jump"></select>
 </div>
</nav>
<main>
 <div id="notes">
  <p class="chead" id="chead"></p>
  <h2 class="ctitle" id="ctitle"></h2>
  <p class="note" data-t="note"></p>
  {{CHAPTERS}}
  <p class="empty" id="empty" hidden></p>
 </div>
 <div id="quiz" hidden>
  <p class="chead" id="qhead"></p>
  <h2 class="ctitle" id="qtitle"></h2>
  <div class="qtop"><div class="score" id="score"></div><button class="btn" id="reset"></button></div>
  <div class="meter"><i id="meter"></i></div>
  <div id="qlist"></div>
 </div>
</main>
<footer><div data-t="foot"></div></footer>
<script>
{
const CH={{DATA}};
const NUMS=Object.keys(CH).map(Number).sort((a,b)=>a-b);
const HEB=['','א','ב','ג','ד','ה','ו','ז','ח','ט','י','יא','יב','יג','יד','טו','טז','יז','יח','יט','כ','כא','כב','כג'];
const T={
 en:{kick:"Peninei Halakha · Shabbat, chapters 11–23",title:"Hilchot Shabbat: my study notes",
  lede:"The melakhot from Borer through Muktzeh, summarized section by section, with a quiz for every chapter to check what stuck.",
  note:"These are a student's notes in my own words, not a psak. For a practical question, ask a rav.",
  q:"Search all chapters…",all:"All",jump:"Jump to section…",empty:"Nothing matches that search.",notes:"Notes",quiz:"Quiz",
  ch:n=>"Chapter "+n,mix:"Mixed quiz",mixT:"Review: questions from every chapter",reset:"Start over",
  of:(a,b,c)=>`${a}/${b}<small>${c} answered</small>`,right:"Correct.",wrong:"Not quite.",qn:(i,n)=>`Question ${i} of ${n}`,
  foot:'Source: Rav Eliezer Melamed, <em>Peninei Halakha – Shabbat</em>, chapters 11–23. Read the full text on Sefaria: <a href="https://www.sefaria.org/Peninei_Halakhah%2C_Shabbat.23.1?lang=bi">Peninei Halakhah, Shabbat</a> (English translation by Yeshivat Har Bracha).'},
 he:{kick:"פניני הלכה · שבת, פרקים יא–כג",title:"הלכות שבת: הסיכומים שלי",
  lede:"המלאכות מבורר ועד מוקצה, בסיכום סעיף אחר סעיף, עם בוחן לכל פרק כדי לבדוק מה נקלט.",
  note:"אלו סיכומים של תלמיד בלשוני, לא פסק הלכה. לשאלה למעשה – לשאול רב.",
  q:"חיפוש בכל הפרקים…",all:"הכול",jump:"מעבר לסעיף…",empty:"אין תוצאות לחיפוש הזה.",notes:"סיכום",quiz:"בוחן",
  ch:n=>"פרק "+HEB[n],mix:"בוחן מעורב",mixT:"חזרה: שאלות מכל הפרקים",reset:"להתחיל מחדש",
  of:(a,b,c)=>`${a}/${b}<small>נענו ${c}</small>`,right:"נכון.",wrong:"לא בדיוק.",qn:(i,n)=>`שאלה ${i} מתוך ${n}`,
  foot:'מקור: הרב אליעזר מלמד, <em>פניני הלכה – שבת</em>, פרקים יא–כג. לטקסט המלא בספריא: <a href="https://www.sefaria.org/Peninei_Halakhah%2C_Shabbat.23.1?lang=bi">פניני הלכה, שבת</a>.'}};
const $=id=>document.getElementById(id);
const q=$('q'),jump=$('jump'),empty=$('empty');
let lang='en',ch=11,mode='notes',cur='all',ans={},mixSet=null;
// phone tables
document.querySelectorAll('.chap table').forEach(t=>{
 const hs=[...t.querySelectorAll('th')].map(th=>th.textContent.trim());
 t.classList.add('stack');
 t.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((td,i)=>{td.setAttribute('data-l',hs[i]||'');const v=document.createElement('span');v.className='v';v.append(...td.childNodes);td.append(v);}));
 const w=document.createElement('div');w.className='tw';t.before(w);w.append(t);
});
document.querySelectorAll('.chap section').forEach(s=>s.dataset.h=s.innerHTML);
const chapEl=(l,n)=>document.querySelector(`.chap[data-lang="${l}"][data-ch="${n}"]`);
function rail(){
 $('rail').innerHTML=NUMS.map(n=>`<button class="chb${n===ch&&!mixSet?' on':''}" data-c="${n}"><b>${lang==='he'?HEB[n]:n}</b><span>${CH[n].t[lang]}</span></button>`).join('')+
  `<button class="chb mix${mixSet?' on':''}" data-c="mix">${T[lang].mix}</button>`;
}
function short(h){return h.replace(/\s*\(.*$/,'').replace(/:.*$/,'')}
function buildChips(){
 jump.hidden=mode!=='notes'||!!q.value.trim();if(jump.hidden)return;
 const ss=[...chapEl(lang,ch).querySelectorAll('section')];
 jump.setAttribute('aria-label',T[lang].jump);
 jump.innerHTML=`<option value="all">${T[lang].jump}</option>`+
  ss.map(s=>`<option value="${s.id}"${cur===s.id?' selected':''}>${short(s.querySelector('h2').textContent)}</option>`).join('');
}
function hl(el,term){
 const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];
 while(w.nextNode())nodes.push(w.currentNode);
 nodes.forEach(n=>{const i=n.nodeValue.toLowerCase().indexOf(term);if(i<0)return;
  const m=document.createElement('mark'),r=n.splitText(i);r.splitText(term.length);m.textContent=r.nodeValue;r.replaceWith(m);});
}
function renderNotes(){
 const term=q.value.trim().toLowerCase();let shown=0;
 $('chead').textContent=term?'':T[lang].ch(ch);$('ctitle').textContent=term?'':CH[ch].t[lang];
 $('chead').hidden=$('ctitle').hidden=!!term;
 document.querySelectorAll('.chap').forEach(c=>{
  const mine=c.dataset.lang===lang&&(term||+c.dataset.ch===ch);let any=0;
  c.querySelectorAll('section').forEach(s=>{
   s.innerHTML=s.dataset.h;
   const ok=mine&&(term?s.textContent.toLowerCase().includes(term):(cur==='all'||s.id===cur));
   s.hidden=!ok;if(ok){any++;shown++;if(term)hl(s,term);}
  });
  c.hidden=!any;const tag=c.querySelector('.ctag');tag.hidden=!term;
  tag.textContent=T[lang].ch(+c.dataset.ch)+' · '+CH[c.dataset.ch].t[lang];
 });
 empty.hidden=shown>0;empty.textContent=T[lang].empty;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function qset(){return mixSet||CH[ch].quiz.map((x,i)=>({c:ch,i}))}
function renderQuiz(){
 const set=qset(),key=mixSet?'mix':String(ch);ans[key]=ans[key]||{};const A=ans[key];
 $('qhead').textContent=mixSet?'':T[lang].ch(ch);$('qhead').hidden=!!mixSet;
 $('qtitle').textContent=mixSet?T[lang].mixT:CH[ch].t[lang];
 const done=Object.keys(A).length,good=set.filter((x,k)=>A[k]===CH[x.c].quiz[x.i].a).length;
 $('score').innerHTML=T[lang].of(good,set.length,done);$('meter').style.width=(done/set.length*100)+'%';
 $('reset').textContent=T[lang].reset;
 $('qlist').innerHTML=set.map((x,k)=>{const Q=CH[x.c].quiz[x.i],a=A[k],did=a!==undefined;
  return `<div class="qcard"><p class="qnum">${T[lang].qn(k+1,set.length)}${mixSet?' · '+T[lang].ch(x.c):''}</p><p class="qq">${Q.q[lang]}</p><div class="opts">`+
  Q.o.map((o,j)=>`<button class="opt${did&&j===Q.a?' right':''}${did&&j===a&&a!==Q.a?' wrong':''}" data-k="${k}" data-j="${j}" ${did?'disabled':''}>${o[lang]}</button>`).join('')+
  `</div>${did?`<p class="why"><b>${a===Q.a?T[lang].right:T[lang].wrong}</b> ${Q.w[lang]}</p>`:''}</div>`}).join('');
}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=T[lang][e.dataset.t]);
 $('b-en').setAttribute('aria-pressed',lang==='en');$('b-he').setAttribute('aria-pressed',lang==='he');
 $('m-notes').textContent=T[lang].notes;$('m-quiz').textContent=T[lang].quiz;
 $('m-notes').setAttribute('aria-pressed',mode==='notes');$('m-quiz').setAttribute('aria-pressed',mode==='quiz');
 q.placeholder=T[lang].q;q.setAttribute('aria-label',T[lang].q);q.hidden=mode!=='notes';
 document.title=lang==='he'?'סיכומי הלכות שבת':'Hilchot Shabbat Notes';
 rail();buildChips();
 $('notes').hidden=mode!=='notes';$('quiz').hidden=mode!=='quiz';
 if(mode==='notes')renderNotes();else renderQuiz();
}
function hash(){try{history.replaceState(null,'','#'+lang+'-'+(mixSet?'mix':ch)+(mode==='quiz'&&!mixSet?'-quiz':''))}catch(e){}}
$('rail').addEventListener('click',e=>{const b=e.target.closest('.chb');if(!b)return;
 if(b.dataset.c==='mix'){const all=[];NUMS.forEach(n=>CH[n].quiz.forEach((x,i)=>all.push({c:n,i})));mixSet=shuffle(all).slice(0,15);ans.mix={};mode='quiz';}
 else{mixSet=null;ch=+b.dataset.c;cur='all';q.value='';}
 render();hash();document.querySelector('.bar').scrollIntoView({block:'start'});});
jump.addEventListener('change',()=>{cur='all';renderNotes();const id=jump.value;
 if(id!=='all')$(id).scrollIntoView({behavior:'smooth',block:'start'});});
q.addEventListener('input',()=>{cur='all';buildChips();renderNotes();});
$('m-notes').addEventListener('click',()=>{mode='notes';mixSet=null;render();hash();});
$('m-quiz').addEventListener('click',()=>{mode='quiz';q.value='';render();hash();});
$('reset').addEventListener('click',()=>{const key=mixSet?'mix':String(ch);ans[key]={};if(mixSet)mixSet=shuffle(mixSet);renderQuiz();});
$('qlist').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;
 const key=mixSet?'mix':String(ch);ans[key][b.dataset.k]=+b.dataset.j;renderQuiz();});
$('b-en').addEventListener('click',()=>{lang='en';render();hash();});
$('b-he').addEventListener('click',()=>{lang='he';render();hash();});
function route(){const m=(location.hash||'').match(/^#(en|he)-(\d+|mix)(-quiz)?$/);
 if(m){lang=m[1];if(m[2]==='mix'){const all=[];NUMS.forEach(n=>CH[n].quiz.forEach((x,i)=>all.push({c:n,i})));mixSet=shuffle(all).slice(0,15);mode='quiz';}
  else if(CH[m[2]]){ch=+m[2];mixSet=null;mode=m[3]?'quiz':'notes';}}
 render();}
addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
